name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ python3

    - name: Build and run C++ unit tests
      run: |
        make
        make unit-test

    - name: Run Protocol V2 integration tests
      run: |
        chmod +x tests/test_basic.sh
        ./tests/test_basic.sh

    - name: Run Mesh auto-routing & failover tests
      run: |
        chmod +x tests/test_mesh.sh
        ./tests/test_mesh.sh

    - name: Run AddressSanitizer tests
      run: |
        chmod +x tests/test_asan.sh
        make asan-test
